```html
{% extends "base.html" %}

{% block title %}Student Details{% endblock %}

{% block content %}

<h1>Student Details</h1>

<table>
    <tr>
        <th>ID</th>
        <td>{{ student.id }}</td>
    </tr>

    <tr>
        <th>Name</th>
        <td>{{ student.name }}</td>
    </tr>

    <tr>
        <th>Email</th>
        <td>{{ student.email }}</td>
    </tr>
</table>

<br>

<a
    href="{{ url_for('web_students.student_edit', id=student.id) }}"
    class="btn"
>
    Edit Student
</a>

<a
    href="{{ url_for('web_students.student_list') }}"
    class="btn"
>
    Back to Students
</a>

{% endblock %}
```
