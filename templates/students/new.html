```html
{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}

<h1>Add New Student</h1>

<form action="{{ url_for('web_students.student_create') }}" method="POST">

    <div class="form-group">
        <label for="name">Student Name</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <button type="submit" class="btn">
        Add Student
    </button>

    <a href="{{ url_for('web_students.student_list') }}" class="btn">
        Cancel
    </a>

</form>

{% endblock %}
```
