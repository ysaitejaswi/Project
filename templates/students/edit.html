<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
</head>

<body>

<h1>Edit Student</h1>

<p>Student ID: {{ student.id }}</p>
<p>Current Name: {{ student.name }}</p>
<p>Current Email: {{ student.email }}</p>

<form
    action="{{ url_for('web_students.student_update', id=student.id) }}"
    method="POST"
>
    <input type="hidden" name="_method" value="PUT">

    <label>Name:</label>
    <input type="text" name="name" value="{{ student.name }}" required>

    <br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ student.email }}" required>

    <br><br>

    <button type="submit">Update Student</button>
</form>

<br>

<a href="{{ url_for('web_students.student_list') }}">
    Back to Students
</a>

</body>
</html>
