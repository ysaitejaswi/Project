{% extends "base.html" %}

{% block content %}

<h1>Courses</h1>

<!-- Search -->
<form method="GET" action="/courses" class="search-form">

    <input
        type="text"
        name="search"
        placeholder="Search by course name or code"
        value="{{ search }}"
    >

    <button type="submit" class="btn">Search</button>

    <a href="/courses" class="btn">Clear</a>

</form>

<br>

<!-- Add Course -->
<a href="/courses/new" class="btn">Add New Course</a>

<br><br>

<!-- Courses Table -->
<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Code</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

        {% for course in courses %}

        <tr>

            <td>{{ loop.index }}</td>

            <td>{{ course.name }}</td>

            <td>{{ course.code }}</td>

            <td>

                <a
                    href="/courses/{{ course.id }}"
                    class="btn"
                >
                    View
                </a>

                <a
                    href="/courses/{{ course.id }}/edit"
                    class="btn"
                >
                    Edit
                </a>

                <form
                    action="/courses/{{ course.id }}/delete"
                    method="POST"
                    style="display:inline;"
                    onsubmit="return confirm('Are you sure you want to delete this course?');"
                >

                    <input
                        type="hidden"
                        name="_method"
                        value="DELETE"
                    >

                    <button
                        type="submit"
                        class="btn"
                    >
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        {% else %}

        <tr>
            <td colspan="4">
                No courses found.
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
