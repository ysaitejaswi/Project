```html
{% extends "base.html" %}

{% block title %}Edit Course{% endblock %}

{% block content %}

<h1>Edit Course</h1>

<form
    action="{{ url_for('web_courses.course_update', id=course.id) }}"
    method="POST"
>
    <input type="hidden" name="_method" value="PUT">

    <label>Course Name:</label>
    <input
        type="text"
        name="name"
        value="{{ course.name }}"
        required
    >

    <br><br>

    <label>Course Code:</label>
    <input
        type="text"
        name="code"
        value="{{ course.code }}"
        required
    >

    <br><br>

    <button type="submit">Update Course</button>
</form>

{% endblock %}
```
