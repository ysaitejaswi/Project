```html
{% extends "base.html" %}

{% block title %}Add Course{% endblock %}

{% block content %}

<h1>Add New Course</h1>

<form
    action="{{ url_for('web_courses.course_create') }}"
    method="POST"
>

    <div class="form-group">
        <label for="name">Course Name</label>

        <input
            type="text"
            id="name"
            name="name"
            required
        >
    </div>

    <div class="form-group">
        <label for="code">Course Code</label>

        <input
            type="text"
            id="code"
            name="code"
            required
        >
    </div>

    <button type="submit" class="btn">
        Add Course
    </button>

    <a
        href="{{ url_for('web_courses.course_list') }}"
        class="btn"
    >
        Cancel
    </a>

</form>

{% endblock %}
```
